<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benim Sayfam</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      padding: 40px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      max-width: 500px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      opacity: 0.9;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    a:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Merhaba</h1>
    <p>Bu benim basit HTML sayfam.</p>
    <a href="https://github.com" target="_blank">GitHub'a Git</a>
  </div>
</body>
</html>
