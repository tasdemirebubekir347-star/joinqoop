<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QOOP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(120, 80, 255, 0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(0, 180, 255, 0.25), transparent 30%),
        linear-gradient(135deg, #050816, #0b1026, #120a2a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 48px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .lang-switch {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 14px;
      margin-bottom: 22px;
      font-size: 14px;
    }
    .lang-switch a {
      color: rgba(255, 255, 255, 0.62);
      text-decoration: none;
    }
    .lang-switch a.is-active {
      color: #8bdcff;
      font-weight: bold;
      text-decoration: underline;
    }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(0, 191, 255, 0.12);
      border: 1px solid rgba(0, 191, 255, 0.35);
      color: #8bdcff;
      font-size: 14px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, #8bdcff, #b388ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 22px;
      color: rgba(255, 255, 255, 0.88);
      max-width: 700px;
      margin: 0 auto 20px;
      line-height: 1.6;
    }
    .desc {
      font-size: 17px;
      color: rgba(255, 255, 255, 0.68);
      max-width: 760px;
      margin: 0 auto 34px;
      line-height: 1.7;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .btn {
      text-decoration: none;
      padding: 15px 26px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s ease;
      display: inline-block;
    }
    .btn-primary {
      background: linear-gradient(90deg, #00c2ff, #7a5cff);
      color: white;
      box-shadow: 0 10px 30px rgba(91, 114, 255, 0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn-secondary {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: white;
    }
    .btn-secondary:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.1); }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 10px;
    }
    .feature {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 22px 18px;
      text-align: left;
    }
    .feature h3 { font-size: 19px; margin-bottom: 10px; color: #ffffff; }
    .feature p { font-size: 15px; color: rgba(255, 255, 255, 0.72); line-height: 1.6; }
    @media (max-width: 820px) {
      h1 { font-size: 46px; }
      .subtitle { font-size: 18px; }
      .features { grid-template-columns: 1fr; }
      .card { padding: 36px 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="lang-switch" role="navigation">
      <a href="#en">English</a>
      <a href="#tr">Türkçe</a>
      <a href="#de">Deutsch</a>
      <a href="#fr">Français</a>
      <a href="#es">Español</a>
    </p>
    <div class="badge" data-i18n="badge">QOOP • More Than Social Media</div>
    <h1>QOOP</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
    <p class="desc" data-i18n="desc"></p>
    <div class="buttons">
      <a class="btn btn-primary" href="https://www.instagram.com/joinqoop/" target="_blank" rel="noopener">Instagram</a>
      <a class="btn btn-secondary" href="https://github.com/tasdemirebubekir347-star/joinqoop" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div class="features">
      <div class="feature">
        <h3 data-i18n="f1t"></h3>
        <p data-i18n="f1d"></p>
      </div>
      <div class="feature">
        <h3 data-i18n="f2t"></h3>
        <p data-i18n="f2d"></p>
      </div>
      <div class="feature">
        <h3 data-i18n="f3t"></h3>
        <p data-i18n="f3d"></p>
      </div>
    </div>
  </div>
  <script>
    var I18N = {
      en: {
        badge: "QOOP • More Than Social Media",
        subtitle: "A next-generation platform that brings together tasks, social interaction, communities, and more.",
        desc: "Qoop is a modern social experience that encourages people not only to consume content, but to take action, share, compete, and grow together.",
        f1t: "Task system",
        f1d: "Daily tasks, rewards, a sense of progress, and a gamified experience.",
        f2t: "Community power",
        f2d: "Clans, social connections, interaction, and people united around shared goals.",
        f3t: "Next-gen experience",
        f3d: "Not ordinary social media — a structure that combines action, competition, and creation."
      },
      tr: {
        badge: "QOOP • Sosyal Medyadan Daha Fazlası",
        subtitle: "Görevler, sosyal etkileşim, topluluklar ve daha fazlasını bir araya getiren yeni nesil platform.",
        desc: "QOOP; insanları sadece içerik tüketmeye değil, harekete geçmeye, paylaşmaya, yarışmaya ve birlikte büyümeye teşvik eden modern bir sosyal deneyimdir.",
        f1t: "Görev Sistemi",
        f1d: "Günlük görevler, ödüller, ilerleme hissi ve oyunlaştırılmış kullanıcı deneyimi.",
        f2t: "Topluluk Gücü",
        f2d: "Klanlar, sosyal bağlantılar, etkileşim ve ortak hedefler etrafında birleşen kullanıcılar.",
        f3t: "Yeni Nesil Deneyim",
        f3d: "Sıradan bir sosyal medya değil; aksiyon, rekabet ve üretkenliği birleştiren güçlü bir yapı."
      },
      de: {
        badge: "QOOP • Mehr als Social Media",
        subtitle: "Eine Plattform der nächsten Generation, die Aufgaben, soziale Interaktion, Communities und mehr verbindet.",
        desc: "Qoop ist ein modernes soziales Erlebnis, das Menschen nicht nur zum Konsumieren von Inhalten anregt, sondern zum Handeln, Teilen, Wettstreiten und gemeinsamen Wachsen.",
        f1t: "Aufgabensystem",
        f1d: "Tägliche Aufgaben, Belohnungen, Fortschritt und ein spielerisches Erlebnis.",
        f2t: "Community-Stärke",
        f2d: "Clans, soziale Verbindungen, Interaktion und Menschen mit gemeinsamen Zielen.",
        f3t: "Next-Gen-Erlebnis",
        f3d: "Kein gewöhnliches Social Media — Aktion, Wettbewerb und Gestaltung in einem."
      },
      fr: {
        badge: "QOOP • Plus que les réseaux sociaux",
        subtitle: "Une plateforme nouvelle génération qui réunit missions, interaction sociale, communautés et plus encore.",
        desc: "Qoop est une expérience sociale moderne qui pousse à agir, partager, se challenger et grandir ensemble — pas seulement à consommer du contenu.",
        f1t: "Système de missions",
        f1d: "Missions quotidiennes, récompenses, progression et expérience ludique.",
        f2t: "Force communautaire",
        f2d: "Clans, liens sociaux, interactions et personnes unies autour d’objectifs communs.",
        f3t: "Expérience nouvelle génération",
        f3d: "Pas un réseau social ordinaire — action, compétition et création réunies."
      },
      es: {
        badge: "QOOP • Más que redes sociales",
        subtitle: "Una plataforma de nueva generación que une misiones, interacción social, comunidades y más.",
        desc: "Qoop es una experiencia social moderna que invita a actuar, compartir, competir y crecer juntos, no solo a consumir contenido.",
        f1t: "Sistema de misiones",
        f1d: "Misiones diarias, recompensas, sensación de progreso y una experiencia gamificada.",
        f2t: "Poder de comunidad",
        f2d: "Clanes, conexiones sociales, interacción y personas unidas por objetivos comunes.",
        f3t: "Experiencia de nueva generación",
        f3d: "No es una red social corriente: combina acción, competencia y creación."
      }
    };
    var langs = ["en", "tr", "de", "fr", "es"];
    function pick() {
      var h = (location.hash || "").replace("#", "").toLowerCase();
      if (langs.indexOf(h) >= 0) return h;
      try {
        var s = localStorage.getItem("qoop_legal_lang");
        if (langs.indexOf(s) >= 0) return s;
      } catch (e) {}
      var n = (navigator.language || "en").slice(0, 2).toLowerCase();
      return langs.indexOf(n) >= 0 ? n : "en";
    }
    function apply(lang) {
      var t = I18N[lang] || I18N.en;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (t[key]) el.textContent = t[key];
      });
      document.querySelectorAll(".lang-switch a").forEach(function (a) {
        a.classList.toggle("is-active", a.getAttribute("href") === "#" + lang);
      });
      try { localStorage.setItem("qoop_legal_lang", lang); } catch (e) {}
    }
    document.addEventListener("DOMContentLoaded", function () { apply(pick()); });
    window.addEventListener("hashchange", function () { apply(pick()); });
  </script>
</body>
</html>
